# Fly configuration. The app name is not in this file, because the repository
# is public. Give it with `fly deploy -a <app>` or the FLY_APP env var.

primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  DATABASE_PATH = "/data/shopping-lists.db"

# The volume has the SQLite database. Litestream copies it to R2.
[mounts]
  source = "data"
  destination = "/data"

# One machine, always on. The realtime bus, the presence map, and the notifier
# are in memory, so do not add a second machine.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
