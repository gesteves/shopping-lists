version: 2

# Weekly version updates. CI (.github/workflows/ci.yml) checks each PR.
# The labels must exist in the repository: Dependabot does not make them.
# Security updates use these settings too, but they do not wait for the
# cooldown.

# The Pro packages come from private registries (#51, .npmrc). The tokens are
# Dependabot secrets.
registries:
  webawesome-pro:
    type: npm-registry
    url: https://npm.cloudsmith.io/fortawesome/webawesome-pro/
    token: ${{secrets.WEBAWESOME_NPM_TOKEN}}
  fontawesome-pro:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{secrets.FONTAWESOME_NPM_AUTH_TOKEN}}

updates:
  # One PR for all minor and patch updates. Each major update gets its own PR,
  # because Next.js, React, and Drizzle majors need a review.
  - package-ecosystem: npm
    directory: /
    registries: [webawesome-pro, fontawesome-pro]
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, javascript]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major of .nvmrc and the Dockerfile.
      # Change its major by hand, with a Node major update.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # "/" covers only .github/workflows. The `uses:` in a composite action needs
  # its own directory. The glob also covers new composite actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, github-actions]

  # The base images in the Dockerfile: Node and Litestream. The Node tag is a
  # major version only (24-trixie-slim), thus each Node PR is a major update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, docker]
